<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lapScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#141e3d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgGradL)" />

  <!-- Laptop Display Lid -->
  <rect x="90" y="100" width="320" height="210" rx="14" fill="url(#lidGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="100" y="110" width="300" height="190" rx="8" fill="url(#lapScreen)"/>

  <!-- Screen Content: Code / Matrix Visual -->
  <circle cx="250" cy="190" r="35" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="250,170 268,202 232,202" fill="none" stroke="#00f2fe" stroke-width="2"/>
  <text x="250" y="245" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="3">APPLE</text>
  <text x="250" y="265" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle">PRO WORKSTATION</text>

  <!-- Laptop Bottom Base -->
  <path d="M 50 310 L 450 310 L 420 345 L 80 345 Z" fill="url(#baseGrad)" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="210" y="312" width="80" height="6" rx="3" fill="#111827"/>

  <!-- Keyboard Glow Line -->
  <line x1="110" y1="318" x2="390" y2="318" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
</svg>