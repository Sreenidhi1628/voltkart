<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="tvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tvDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="50%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="230" r="240" fill="url(#tvGlow)"/>

  <!-- TV Frame -->
  <rect x="60" y="80" width="380" height="235" rx="6" fill="#111827" stroke="#ef4444" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Screen Glass -->
  <rect x="68" y="88" width="364" height="219" rx="3" fill="url(#tvDisplay)"/>

  <!-- Futuristic OLED Visual -->
  <circle cx="250" cy="180" r="50" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  <circle cx="250" cy="180" r="70" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="250" y="186" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="4">4K 120Hz</text>
  <text x="250" y="240" fill="#ef4444" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle" font-weight="600">CINEMATIC OLED • ONEPLUS</text>

  <!-- TV Stand Base -->
  <polygon points="210,315 290,315 315,365 185,365" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <rect x="170" y="365" width="160" height="8" rx="4" fill="#374151" stroke="#ef4444" stroke-width="1"/>
</svg>