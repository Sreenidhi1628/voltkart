<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="audGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#audGlow)"/>

  <!-- Headband Arch -->
  <path d="M 140 270 C 140 120, 360 120, 360 270" fill="none" stroke="url(#headband)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 145 260 C 145 135, 355 135, 355 260" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round"/>

  <!-- Left Earcup -->
  <rect x="110" y="250" width="55" height="100" rx="26" fill="#1e293b" stroke="#f1f5f9" stroke-width="2"/>
  <rect x="120" y="260" width="35" height="80" rx="16" fill="#0f172a"/>

  <!-- Right Earcup -->
  <rect x="335" y="250" width="55" height="100" rx="26" fill="#1e293b" stroke="#f1f5f9" stroke-width="2"/>
  <rect x="345" y="260" width="35" height="80" rx="16" fill="#0f172a"/>

  <!-- Sound Rings Center -->
  <circle cx="250" cy="280" r="30" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="250" cy="280" r="18" fill="#f1f5f9" fill-opacity="0.3"/>
  <text x="250" y="340" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="2">NOTHING</text>
  <text x="250" y="360" fill="#f1f5f9" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle">ACTIVE NOISE CANCELING</text>
</svg>