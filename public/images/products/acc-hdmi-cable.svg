<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="accGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#accGlow)"/>

  <!-- Central Device Icon Box -->
  <rect x="140" y="140" width="220" height="220" rx="24" fill="url(#metalAcc)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Tech details inside -->
  <rect x="160" y="160" width="180" height="180" rx="16" fill="#090d16" opacity="0.8"/>
  <circle cx="250" cy="230" r="45" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M225 230 L275 230 M250 205 L250 255" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

  <!-- Text -->
  <text x="250" y="300" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="2">VOLTKART</text>
  <text x="250" y="320" fill="#10b981" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle" font-weight="600">HDMI 2.1 48GBPS</text>

  <!-- Ports / connectors pins on edge -->
  <rect x="235" y="115" width="30" height="25" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <line x1="242" y1="120" x2="258" y2="120" stroke="#10b981" stroke-width="2"/>
</svg>