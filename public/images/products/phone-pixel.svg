<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="50%" stop-color="#141e38"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)" />

  <!-- Phone Body -->
  <rect x="150" y="60" width="200" height="380" rx="36" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))"/>

  <!-- Bezel / Edge Highlight -->
  <rect x="153" y="63" width="194" height="374" rx="33" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Screen -->
  <rect x="160" y="74" width="180" height="352" rx="26" fill="url(#screenGrad)"/>

  <!-- Dynamic Island / Punch Hole -->
  <rect x="220" y="86" width="60" height="16" rx="8" fill="#030712"/>
  <circle cx="266" cy="94" r="3.5" fill="#1e293b"/>

  <!-- Futuristic Screen Graphic -->
  <circle cx="250" cy="220" r="45" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-dasharray="8 4" filter="url(#glow)"/>
  <circle cx="250" cy="220" r="25" fill="#38bdf8" fill-opacity="0.2"/>
  <path d="M235 220 L245 230 L265 210" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Sound wave visualizer -->
  <rect x="185" y="300" width="6" height="24" rx="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="197" y="290" width="6" height="44" rx="3" fill="#38bdf8" opacity="0.9"/>
  <rect x="209" y="310" width="6" height="16" rx="3" fill="#38bdf8" opacity="0.4"/>
  <rect x="221" y="285" width="6" height="54" rx="3" fill="#00f2fe" opacity="1"/>
  <rect x="233" y="295" width="6" height="36" rx="3" fill="#38bdf8" opacity="0.8"/>
  <rect x="245" y="305" width="6" height="20" rx="3" fill="#38bdf8" opacity="0.5"/>
  <rect x="257" y="288" width="6" height="48" rx="3" fill="#38bdf8" opacity="0.9"/>
  <rect x="269" y="312" width="6" height="12" rx="3" fill="#38bdf8" opacity="0.4"/>
  <rect x="281" y="296" width="6" height="34" rx="3" fill="#00f2fe" opacity="0.7"/>
  <rect x="293" y="308" width="6" height="18" rx="3" fill="#38bdf8" opacity="0.5"/>
  <rect x="305" y="302" width="6" height="26" rx="3" fill="#38bdf8" opacity="0.6"/>

  <!-- Screen Text -->
  <text x="250" y="375" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">GOOGLE</text>
  <text x="250" y="395" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle" opacity="0.9">5G ULTRA • VOLTKART</text>
  
  <!-- Home Indicator bar -->
  <rect x="220" y="415" width="60" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
</svg>